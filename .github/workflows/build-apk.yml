name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riders-live-location/mobile/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -iname "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not locate sdkmanager under \$ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT)"
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: riders-live-location-debug-apk
          path: riders-live-location/mobile/android/app/build/outputs/apk/debug/app-debug.apk
